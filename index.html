<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080f1c" />
    <meta name="description" content="Radar wojskowych samolotów nad Polską i Europą — alerty push, mapa, historia tras." />
    <meta name="color-scheme" content="dark" />

    <!-- iOS PWA: standalone. 'black-translucent' USUNIĘTE świadomie, na
         podstawie pomiaru z iPhone'a 17 (v2.3.0, build 09-18 15:07):

             screen.height 874   innerHeight 812   wcięcia 62 / 34

         iOS daje tej aplikacji 812 px z 874 i nie da więcej — 62 px nie należy
         do strony, więc żaden CSS ich nie wypełni. Pytanie brzmi wyłącznie:
         GDZIE ta luka wypada.

         Z 'black-translucent' strona zaczyna się na samej górze ekranu, a 62 px
         zostaje NA DOLE — czarny pas nad paskiem gestu, który wygląda jak
         usterka. Bez tej deklaracji iOS kładzie stronę pod paskiem stanu i luka
         wraca NA GÓRĘ, gdzie i tak jest zegarek z baterią, a 'theme-color'
         poniżej barwi ją na granat interfejsu.

         Ta sama dziura, ale w miejscu, w którym czyta się jak pasek stanu,
         a nie jak brak kawałka mapy. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Standardowy odpowiednik powyższego. Chrome od dawna zgłasza wariant
         'apple-' jako przestarzały; bez tej linii konsola sypie ostrzeżeniem
         przy każdym wejściu. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Radar" />

    <!-- Open Graph -->
    <meta property="og:title" content="Radar Wojskowy" />
    <meta property="og:description" content="Śledzenie wojskowych samolotów nad Polską i Europą." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pl_PL" />

    <!-- Open the TLS connection to tile providers in parallel with JS download — saves ~200-400 ms on first tile fetch -->
    <link rel="preconnect" href="https://a.tile.openstreetmap.org" crossorigin />
    <link rel="preconnect" href="https://b.tile.openstreetmap.org" crossorigin />
    <link rel="preconnect" href="https://c.tile.openstreetmap.org" crossorigin />
    <link rel="dns-prefetch" href="https://a.basemaps.cartocdn.com" />
    <link rel="dns-prefetch" href="https://b.basemaps.cartocdn.com" />
    <link rel="dns-prefetch" href="https://c.basemaps.cartocdn.com" />
    <link rel="dns-prefetch" href="https://server.arcgisonline.com" />
    <link rel="dns-prefetch" href="https://opendata.adsb.fi" />
    <link rel="dns-prefetch" href="https://api.planespotters.net" />
    <!-- Serwer samych plików zdjęć — inna domena niż API, a to z niej idzie
         obrazek na karcie maszyny. -->
    <link rel="dns-prefetch" href="https://t.plnspttrs.net" />
    <link rel="dns-prefetch" href="https://api.adsbdb.com" />

    <link rel="icon" type="image/svg+xml" href="/radar-icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Radar Wojskowy</title>
    <style>
      /* Inline the bare-minimum styles so the page is non-white before
         the CSS bundle is parsed. Avoids LCP-counting against us during
         a brief flash. */
      html, body, #root { margin: 0; height: 100%; background: #040a14; }
      /* Ten sam stos, co po doczytaniu arkusza — inaczej pierwszy klatkę
         widać Courierem, a potem tekst przeskakuje. */
      body { color: #ccd; font-family: 'Barlow Semi Condensed', 'Roboto Condensed', 'Helvetica Neue', system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
      .boot-splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.45); font-size: 12px; letter-spacing: 2px; }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-splash">◌ RADAR · MILITARY RADAR</div></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // If React hasn't mounted within 10 s (network failure, JS exception,
      // browser issue) replace the spinner with an actionable fallback so
      // the user knows the boot stalled instead of staring at ◌ forever.
      // Bilingual error message — i18n module hasn't loaded yet at this
      // point so we hard-code both languages.
      setTimeout(function () {
        var root = document.getElementById('root');
        var splash = root && root.querySelector('.boot-splash');
        if (splash && splash.textContent.charAt(0) === '◌') {
          var lang = (navigator.language || 'en').slice(0, 2).toLowerCase();
          var title = lang === 'pl' ? '⚠ Aplikacja nie odpowiada' : '⚠ Application is not responding';
          var hint  = lang === 'pl' ? 'Sprawdź połączenie i przeładuj stronę.' : 'Check your connection and reload the page.';
          splash.style.color = '#ff7a55';
          splash.style.fontSize = '14px';
          splash.style.padding = '0 20px';
          splash.style.textAlign = 'center';
          splash.innerHTML = title + '<br><small style="opacity:.8;font-size:11px;display:inline-block;margin-top:6px">' + hint + '</small>';
        }
      }, 10000);
    </script>
    <noscript>
      <div style="padding:20px;color:#ccc;text-align:center">Włącz JavaScript / Enable JavaScript</div>
    </noscript>
  </body>
</html>
