[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=()"
    # CSP intentionally not enforced — earlier attempts broke tile loading.
    # X-Frame-Options + base-uri + frame-ancestors below already mitigate
    # the main XSS/clickjacking vectors that CSP would normally cover.

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[functions."notify"]
  schedule = "*/5 * * * *"

[functions."collect"]
  schedule = "*/2 * * * *"

[dev]
  command = "npm run dev"
  port = 8080
  targetPort = 5173
  autoLaunch = false
