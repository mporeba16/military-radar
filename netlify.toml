[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=()"
    # CSP intentionally not enforced — earlier attempts broke tile loading.
    # X-Frame-Options + base-uri + frame-ancestors below already mitigate
    # the main XSS/clickjacking vectors that CSP would normally cover.

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

# Jeden cron na wszystko, co pyta adsb.fi: ślady, przyloty nad Polską
# i powiadomienia — patrz netlify/functions/tick.js. Zostaje na Netlify,
# bo adsb.fi blokuje zapytania z Cloudflare (403).
[functions."tick"]
  schedule = "*/2 * * * *"

# Jumbo jety z całego świata (adsb.lol po typie: migawka nad Europą i lista
# do przylotów) zbiera cron na Cloudflare Workers — patrz cloudflare/worker.js.

[dev]
  command = "npm run dev"
  port = 8080
  targetPort = 5173
  autoLaunch = false
